# OMIXFlow: конфиг проекта. Только значения; правила живут в адаптерах плагина
# и в .claude/omixflow/{port}/ проекта. Схема: schema/flow.schema.json в плагине.
# Проверка: /omixflow:doctor

version: 1

# plugin:
#   min_version: 0.4.3
#   backlog: ~/omi/omixflow/.tasks/backlog   # бэклог локального клона плагина: заметки о его дефектах

# Источник задач. Адаптеры плагина: youtrack, local, kanban, none. Свой: файл
# .claude/omixflow/tracker/{name}.md с port: tracker.
tracker:
  adapter: none
  # project: AL                        # ключ проекта (youtrack)
  # id_pattern: "^[A-Z]+-\\d+$"        # переопределение шаблона id адаптера
  # status_map:                        # абстрактный статус → статус трекера
  #   in_work: In Work
  #   in_review: Waiting for review
  #   done: Finished
  # create_defaults:                   # поля при создании задачи
  #   Type: Task
  # dir: .tasks/backlog                # каталог задач адаптера local
  # kanban: доска на ветке board, открытой worktree в .tasks/board/; задачи T-1, T-2…
  #   adapter: kanban, project: T (префикс номеров), branch: board, dir: .tasks/board,
  #   push: true; artifacts.tracked: false, в .gitignore кодовых веток /.tasks/* и !/.tasks/_lead/

# Хостинг кода. Адаптеры: github, none.
forge:
  adapter: none

# Языки проекта. Адаптеры: ts. Несколько языков: [ts, go].
lang: [ts]

# Репозиторий и git-флоу. Адаптер по умолчанию git.
workspace:
  base: auto                           # main | release/*:latest | auto (default-ветка remote)
  branch: "task/{id}"                  # часть мультизадачи получает {branch}-{part}
  worktree: optional                   # off | optional | always
  # setup: pnpm install                # установка зависимостей (worktree, doctor)
  # submodules:
  #   - path: omix
  #     readonly: true
  integration: squash                  # squash | merge (интеграция части мультизадачи)
  # sync: auto                         # auto | merge | rebase: как подтягивать ушедшую базу
  # delivery: pr                       # pr | integrate | lead: как сдаётся задача без лида (под лидом — lead.delivery)
  # protected: [master, "release/*"]   # ветки, куда нельзя коммитить напрямую
  # repos:                             # чужие репозитории для исследования (профиль research)
  #   omix-lib:                        # имя: slug, им ссылается колонка repo блока мультизадачи
  #     path: ../eps-omix-lib          # путь относительно корня этого проекта
  #     remote: git@github.com:org/eps-omix-lib.git   # identity, doctor сверяет с origin
  #     ref: auto                      # ветка | тег | sha | auto (базовая ветка того проекта)
  #     setup: false                   # выполнять его workspace.setup в research-worktree

# Гейты проверки. Строка = команда с критерием exit-code; объект даёт критерий,
# фон и условия обязательности. Имена фиксированы: typecheck, test, lint, build, e2e, visual.
verify:
  test: "echo 'configure verify.test'"
  # typecheck: pnpm check-types
  # lint: { cmd: "pnpm lint", criterion: zero-diagnostics }
  # build: { cmd: "pnpm build", background: true }
  # e2e: { cmd: "pnpm e2e", criterion: rerun-compare-set, background: true, when: [i18n, styles, mocks] }
  # visual: { cmd: "pnpm test:visual", background: true, when: [styles, uikit] }

# Артефакты задач.
artifacts:
  dir: .tasks
  tracked: true                        # версионировать вместе с кодом (для мультизадачи обязательно)

# Лимиты протокола.
limits:
  coder_iterations: 7                  # попыток coder на шаг до эскалации
  review_passes: 3                     # проходов ревью до эскалации
  agent_rotation_steps: 10             # шагов плана до смены continuation-агента

# Пороги тиров.
tiers:
  s_max_files: 5
  m_max_files: 15

# Модели агентов: сильная и облегчённая; используются таблицей в protocol/tiers.md.
models:
  strong: opus
  light: sonnet

# Мультизадача.
multitask:
  parallel_per_owner: 1                # активных частей на одного исполнителя
  push: true                           # пушить ветки мультизадачи и частей (несколько исполнителей)
  parallel_parts: 4                    # одновременных researcher'ов в немутирующем профиле

# Замена агентов ядра агентами проекта (.claude/agents/{name}.md).
# agents:
#   coder: my-coder

# Лид: маршрут вопросов сессии, запущенной с --lead; без флага секция не действует.
# Режимы: developer (разработчик через окно лида), lead (решает лид),
# direct (разработчик в сессии задачи, лид уведомлён). Ключи policy это
# идентификаторы точек решения из protocol/dialog.md плагина.
# lead:
#   default: developer                 # для точек, не перечисленных в policy
#   timeout: 10m                       # ожидание ack лида, затем вопрос задаётся в сессии
#   stall: 15m                         # простой сессии без вопроса дольше этого лид сообщает разработчику
#   delivery: lead                     # способ сдачи под лидом; lead — без вопроса в точке delivery
#   plugin_session: omixflow-lead      # сессия, ведущая плагин: лид шлёт ей гочи плагина
#   notify: [visible-behaviour]        # решение лида, меняющее видимое поведение, сразу показывается (lead-notify)
#   actions:                           # собственные действия лида без санкции (трекер и ветки всегда по санкции)
#     backlog: lead                    # заметки бэклога из гочей
#     memory: lead                     # память проекта
#   policy:                            # рекомендуемое: рутину решает лид, постановку и видимое другим разработчик
#     design-question: lead
#     finding: lead
#     resume: lead
#     gotchas: lead
#     tracker.comment: lead
#     tracker.status: lead
#     workspace.branch: lead
#     workspace.exit: lead
#     tracker.describe: developer
